[package]
name = "meridian-executor"
description = "The thin executor that runs on the owner's machines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "meridian-executor"
path = "src/main.rs"

[dependencies]
meridian-executor-capabilities = { path = "../capabilities" }
meridian-executor-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Memory"]
