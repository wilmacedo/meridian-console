[package]
name = "meridian-executor-core"
description = "Connection, authentication, capability registry and protocol of the Meridian executor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
