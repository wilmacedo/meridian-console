[package]
name = "meridian-executor-capabilities"
description = "What the Meridian executor can do on a device, one module per capability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
meridian-executor-core = { path = "../core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
